<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Idea Graveyard</title>
<meta name="description" content="Where ideas go to rest. Wander the graveyard, read the epitaphs, bury your own.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🪦</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
  :root { --ink:#e8e4d8; --dim:#9a968a; --accent:#9fe0b0; --card:#14161dee; }
  * { box-sizing:border-box; }
  html,body { margin:0; height:100%; overflow:hidden; background:#07080d; color:var(--ink);
    font-family:"IM Fell English", Georgia, serif; -webkit-tap-highlight-color:transparent; }
  canvas { display:block; touch-action:none; cursor:grab; }
  canvas.dragging { cursor:grabbing; }
  canvas.pointer { cursor:pointer; }

  .hud { position:fixed; left:0; right:0; display:flex; justify-content:space-between; align-items:center;
    padding:14px 16px; pointer-events:none; }
  .hud.top { top:0; padding-top:max(14px, env(safe-area-inset-top)); }
  .hud.bottom { bottom:0; justify-content:center; padding-bottom:max(14px, env(safe-area-inset-bottom)); }
  .hud > * { pointer-events:auto; }
  .brand { font-size:20px; letter-spacing:.12em; text-shadow:0 0 12px #000; }
  .brand small { display:block; font-size:12px; letter-spacing:.05em; color:var(--dim); font-style:italic; }
  .hint { font-style:italic; color:var(--dim); font-size:14px; text-shadow:0 0 8px #000; transition:opacity 1s; }

  button, .btn { font:inherit; color:var(--ink); background:#ffffff10; border:1px solid #ffffff30;
    padding:9px 14px; border-radius:6px; cursor:pointer; backdrop-filter:blur(4px); font-size:15px; text-decoration:none; }
  button:hover, .btn:hover { background:#ffffff22; border-color:var(--accent); }
  button.primary { background:#9fe0b022; border-color:#9fe0b088; }

  #intro { position:fixed; inset:0; display:grid; place-items:center; text-align:center; padding:24px;
    background:radial-gradient(ellipse at center, #0b0d14cc, #000000f2); transition:opacity 1.2s; z-index:5; }
  #intro.gone { opacity:0; pointer-events:none; }
  #intro h1 { font-weight:400; font-size:clamp(34px, 8vw, 72px); letter-spacing:.14em; margin:0 0 8px;
    text-shadow:0 0 30px #9fe0b055; }
  #intro p { color:var(--dim); font-style:italic; font-size:clamp(16px, 3.5vw, 20px); margin:0 0 28px; }

  #modal { position:fixed; inset:0; display:grid; place-items:center; padding:16px; background:#000a; z-index:10;
    opacity:0; pointer-events:none; transition:opacity .35s; }
  #modal.open { opacity:1; pointer-events:auto; }
  .card { width:min(440px, 100%); max-height:90vh; overflow:auto; background:var(--card); border:1px solid #ffffff22;
    border-radius:10px; padding:26px 24px 22px; position:relative; box-shadow:0 20px 80px #000; transform:translateY(10px);
    transition:transform .35s; }
  #modal.open .card { transform:none; }
  .close { position:absolute; top:8px; right:8px; border:none; background:none; font-size:24px; padding:4px 10px; }
  .card h2 { font-weight:400; font-size:28px; margin:0 0 4px; letter-spacing:.03em; }
  .dates { color:var(--dim); letter-spacing:.2em; margin-bottom:18px; }
  .label { font-size:12px; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); }
  .cause { margin:4px 0 18px; font-size:18px; }
  blockquote { margin:0 0 22px; padding:12px 16px; border-left:2px solid var(--accent); font-style:italic; font-size:20px; background:#ffffff08; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .muted { color:var(--dim); font-size:14px; }

  .ad h2 { font-family:"Bebas Neue", Impact, sans-serif; font-size:44px; letter-spacing:.04em; margin-bottom:0; }
  .ad .tag { font-size:19px; margin:0 0 12px; }
  .ad .fine { font-size:11px; color:var(--dim); margin-top:16px; font-family:Arial, sans-serif; line-height:1.4; }
  .ad .sponsored { font:11px Arial, sans-serif; letter-spacing:.15em; color:#000; background:#ffd84a; padding:2px 6px; border-radius:3px; display:inline-block; margin-bottom:10px; }

  form label { display:block; margin:0 0 12px; }
  form input, form textarea { width:100%; font:inherit; font-size:16px; color:var(--ink); background:#00000055;
    border:1px solid #ffffff2a; border-radius:6px; padding:8px 10px; margin-top:4px; }
  form textarea { resize:vertical; min-height:56px; }
  .years { display:flex; gap:10px; }
  .years label { flex:1; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div class="hud top">
  <div class="brand">IDEA GRAVEYARD<small id="count"></small></div>
  <button id="buryBtn" class="primary">⚰ Bury an idea</button>
</div>
<div class="hud bottom"><div class="hint" id="hint">drag to wander · tap a stone to pay respects</div></div>

<div id="intro">
  <div>
    <h1>THE IDEA<br>GRAVEYARD</h1>
    <p>Where ideas go to rest. Some good. Mostly not.</p>
    <button id="enter" class="primary">Enter quietly</button>
  </div>
</div>

<div id="modal" role="dialog" aria-modal="true"><div class="card" id="card"></div></div>

<script src="graves.js"></script>
<script src="main.js"></script>
</body>
</html>
